; Firmware edge node Wind Edge Chip (ESP32 + FPGA Tang Nano 4K)
; Build:  pio run -d edge/esp32            Upload: pio run -d edge/esp32 -t upload
; Uji inti di laptop (tanpa papan): python3 edge/esp32/test/run_native.py

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient@2.8
    4-20ma/ModbusMaster@2.0.1
    bblanchon/ArduinoJson@7.2.1
; bobot MLP dari ml/ (satu sumber dengan FPGA dan Node-RED)
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I../../ml/forecast/model/export
    -I../../ml/status/model/export

; papan yang dibeli tim (RAB): ESP32-S3-DevKitC-1 N16R8
[env:esp32s3]
build_src_filter = +<*> -<hil_main.cpp> -<bridge_main.cpp> -<daya_main.cpp>
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32 klasik (DevKit V1 / WROOM-32)
[env:esp32dev]
board = esp32dev
build_src_filter = +<*> -<hil_main.cpp> -<bridge_main.cpp> -<daya_main.cpp>

; uji HIL ESP32-S3 <-> FPGA saja (tanpa sensor/WiFi): src/hil_main.cpp + 597 vektor uji nyata
[env:esp32s3_hil]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = -<*> +<hil_main.cpp> +<fpga_link.cpp>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 sebagai jembatan live MQTT -> FPGA -> MQTT (selama sensor belum dirakit): src/bridge_main.cpp
[env:esp32s3_bridge]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = -<*> +<bridge_main.cpp> +<fpga_link.cpp>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; pengukur daya komputasi: ESP32 klasik terpisah + 2x INA219 (Raspi, FPGA+ESP32-S3) -> MQTT WEC/daya
[env:esp32_daya]
board = esp32dev
; CP2102 papan pengukur gagal berkomunikasi dengan flash pada 460800 baud.
upload_speed = 115200
build_src_filter = -<*> +<daya_main.cpp>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit INA219@1.2.3
