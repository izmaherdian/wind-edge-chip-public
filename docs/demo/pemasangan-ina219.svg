<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1290" viewBox="0 0 1500 1290">
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; fill: #1e293b; }
      .title { font-size: 31px; font-weight: bold; }
      .head { font-size: 24px; font-weight: bold; }
      .label { font-size: 20px; }
      .small { font-size: 18px; }
      .tiny { font-size: 16px; }
      .pin { font-size: 17px; font-family: 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>
  <rect width="1500" height="1290" fill="#f8fafc"/>
  <text x="750" y="48" class="title" text-anchor="middle">Pemasangan 2× INA219: Raspberry Pi dan FPGA + ESP32-S3</text>
  <text x="750" y="80" class="small" text-anchor="middle">Skema hubungan listrik (bukan posisi fisik). Firmware: edge/esp32 env esp32_daya, pin sesuai kode tim.</text>

  <!-- sumber daya -->
  <rect x="100" y="110" width="300" height="90" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="250" y="148" class="head" text-anchor="middle">Adaptor 5,1 V 3 A</text>
  <text x="250" y="178" class="tiny" text-anchor="middle">khusus Raspberry Pi</text>
  <rect x="1100" y="110" width="300" height="90" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1250" y="148" class="head" text-anchor="middle">Adaptor 5 V ≥ 2 A</text>
  <text x="1250" y="178" class="tiny" text-anchor="middle">FPGA + ESP32-S3</text>
  <rect x="590" y="110" width="320" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="750" y="148" class="head" text-anchor="middle">USB laptop / charger</text>
  <text x="750" y="178" class="tiny" text-anchor="middle">daya ESP32 klasik saja</text>

  <!-- jalur +5V lewat shunt -->
  <path d="M250 200V296" fill="none" stroke="#dc2626" stroke-width="6" marker-end="url(#red)"/>
  <text x="262" y="255" class="tiny" fill="#dc2626">+5 V (kabel merah)</text>
  <path d="M1250 200V296" fill="none" stroke="#dc2626" stroke-width="6" marker-end="url(#red)"/>
  <text x="1262" y="255" class="tiny" fill="#dc2626">+5 V</text>
  <path d="M750 200V296" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
  <text x="762" y="255" class="tiny" fill="#2563eb">USB</text>

  <!-- INA1 -->
  <rect x="100" y="300" width="300" height="220" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="200" y="400" class="head" text-anchor="middle">INA1 (0x40)</text>
  <text x="200" y="427" class="tiny" text-anchor="middle">mengukur Raspi</text>
  <text x="250" y="322" class="pin" text-anchor="middle" fill="#dc2626">Vin+</text>
  <text x="250" y="508" class="pin" text-anchor="middle" fill="#dc2626">Vin−</text>
  <text x="392" y="335" class="pin" text-anchor="end">VCC</text>
  <text x="392" y="370" class="pin" text-anchor="end">GND</text>
  <text x="392" y="405" class="pin" text-anchor="end">SCL</text>
  <text x="392" y="440" class="pin" text-anchor="end">SDA</text>

  <!-- INA2 -->
  <rect x="1100" y="300" width="300" height="220" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="1300" y="400" class="head" text-anchor="middle">INA2 (0x40)</text>
  <text x="1300" y="427" class="tiny" text-anchor="middle">mengukur FPGA + S3</text>
  <text x="1250" y="322" class="pin" text-anchor="middle" fill="#dc2626">Vin+</text>
  <text x="1250" y="508" class="pin" text-anchor="middle" fill="#dc2626">Vin−</text>
  <text x="1108" y="335" class="pin">VCC</text>
  <text x="1108" y="370" class="pin">GND</text>
  <text x="1108" y="405" class="pin">SCL</text>
  <text x="1108" y="440" class="pin">SDA</text>

  <!-- ESP32 klasik -->
  <rect x="590" y="300" width="320" height="260" rx="18" fill="#ecfdf5" stroke="#168062" stroke-width="3"/>
  <text x="750" y="480" class="head" text-anchor="middle">ESP32 klasik</text>
  <text x="750" y="508" class="tiny" text-anchor="middle">DevKit V1 · eduroam → MQTT</text>
  <text x="750" y="534" class="tiny" text-anchor="middle">WEC/daya tiap 1 detik</text>
  <text x="600" y="335" class="pin">3V3</text>
  <text x="600" y="370" class="pin">GND</text>
  <text x="600" y="405" class="pin">GPIO22</text>
  <text x="600" y="440" class="pin">GPIO21</text>
  <text x="900" y="335" class="pin" text-anchor="end">3V3</text>
  <text x="900" y="370" class="pin" text-anchor="end">GND</text>
  <text x="900" y="405" class="pin" text-anchor="end">GPIO19</text>
  <text x="900" y="440" class="pin" text-anchor="end">GPIO18</text>

  <!-- kabel I2C + catu sensor -->
  <g stroke-width="4" fill="none">
    <path d="M400 330H590" stroke="#ea580c"/>
    <path d="M400 365H590" stroke="#111827"/>
    <path d="M400 400H590" stroke="#7c3aed"/>
    <path d="M400 435H590" stroke="#16a34a"/>
    <path d="M910 330H1100" stroke="#ea580c"/>
    <path d="M910 365H1100" stroke="#111827"/>
    <path d="M910 400H1100" stroke="#7c3aed"/>
    <path d="M910 435H1100" stroke="#16a34a"/>
  </g>
  <text x="495" y="460" class="tiny" text-anchor="middle">I2C 0: SDA 21 / SCL 22</text>
  <text x="1005" y="460" class="tiny" text-anchor="middle">I2C 1: SDA 18 / SCL 19</text>
  <text x="495" y="322" class="tiny" text-anchor="middle" fill="#ea580c">3,3 V</text>
  <text x="1005" y="322" class="tiny" text-anchor="middle" fill="#ea580c">3,3 V</text>

  <!-- keluar shunt ke perangkat -->
  <path d="M250 520V616" fill="none" stroke="#dc2626" stroke-width="6" marker-end="url(#red)"/>
  <path d="M1250 520V580H1150V616" fill="none" stroke="#dc2626" stroke-width="6" marker-end="url(#red)"/>
  <path d="M1250 580H1350V616" fill="none" stroke="#dc2626" stroke-width="6" marker-end="url(#red)"/>

  <!-- perangkat -->
  <rect x="100" y="620" width="300" height="150" rx="16" fill="#fff7ed" stroke="#c65b12" stroke-width="3"/>
  <text x="250" y="660" class="head" text-anchor="middle">Raspberry Pi</text>
  <text x="250" y="690" class="tiny" text-anchor="middle">5 V lewat USB-C (kabel</text>
  <text x="250" y="712" class="tiny" text-anchor="middle">dipotong: merah lewat INA1)</text>
  <text x="250" y="740" class="tiny" text-anchor="middle">atau pin 5V (pin 2/4)</text>
  <rect x="1050" y="620" width="200" height="150" rx="16" fill="#fff7ed" stroke="#c65b12" stroke-width="3"/>
  <text x="1150" y="660" class="head" text-anchor="middle">Tang Nano 4K</text>
  <text x="1150" y="690" class="tiny" text-anchor="middle">5 V lewat USB-C</text>
  <text x="1150" y="712" class="tiny" text-anchor="middle">(merah lewat INA2)</text>
  <rect x="1260" y="620" width="190" height="150" rx="16" fill="#ecfdf5" stroke="#168062" stroke-width="3"/>
  <text x="1355" y="660" class="head" text-anchor="middle">ESP32-S3</text>
  <text x="1355" y="690" class="tiny" text-anchor="middle">5 V lewat USB</text>
  <text x="1355" y="712" class="tiny" text-anchor="middle">(merah lewat INA2)</text>
  <text x="1035" y="690" class="tiny" text-anchor="end">UART S3 ↔ FPGA</text>
  <text x="1035" y="712" class="tiny" text-anchor="end">tidak berubah</text>

  <!-- GND bersama -->
  <g stroke="#111827" stroke-width="4" fill="none">
    <path d="M100 155H70V840H1430"/>
    <path d="M1400 155H1470V840H1430"/>
    <path d="M250 770V840"/>
    <path d="M1150 770V840"/>
    <path d="M1355 770V840"/>
    <path d="M750 560V840"/>
  </g>
  <text x="750" y="868" class="label" text-anchor="middle" font-weight="bold">GND BERSAMA: GND kedua adaptor, Raspi, FPGA, ESP32-S3, kedua INA219, dan ESP32 klasik</text>

  <!-- catatan -->
  <rect x="60" y="895" width="1380" height="370" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="932" class="small" font-weight="bold">1. Arus diukur seri di kabel +5 V: adaptor → Vin+ → (shunt 0,1 Ω) → Vin− → perangkat. Kabel GND tidak lewat INA.</text>
  <text x="85" y="967" class="small">2. Satukan semua GND. INA219 membaca tegangan Vin− terhadap GND-nya; tanpa GND bersama tegangan terbaca ±0 V.</text>
  <text x="85" y="1002" class="small">3. Saat mengukur, perangkat hanya diberi daya lewat INA: cabut kabel USB laptop dari Raspi, Tang Nano 4K, dan ESP32-S3</text>
  <text x="105" y="1030" class="small">(USB laptop juga memberi 5 V, sehingga arusnya tidak terukur). ESP32-S3 dan FPGA tetap jalan sendiri lewat eduroam.</text>
  <text x="85" y="1065" class="small">4. Kabel USB "dipotong": buka selubung, potong hanya kawat merah (VBUS), sambungkan ujung sumber ke Vin+ dan ujung</text>
  <text x="105" y="1093" class="small">perangkat ke Vin−. Kawat hitam (GND) disambung lurus; kawat data boleh dibiarkan. Atau pakai modul USB pass-through.</text>
  <text x="85" y="1128" class="small">5. INA219 dan kalibrasi 32V_2A membaca sampai ±3,2 A. Raspi 4 bisa puncak ±3 A; shunt menurunkan ±0,3 V, jadi pakai</text>
  <text x="105" y="1156" class="small">adaptor 5,1 V dan kabel pendek-tebal agar Raspi tidak under-voltage (ikon petir).</text>
  <text x="85" y="1191" class="small">6. VCC INA219 ke 3V3 ESP32 klasik (bukan 5 V); SDA/SCL tidak tertukar. Kedua INA boleh beralamat 0x40 karena beda bus.</text>
  <text x="85" y="1226" class="small">7. Cek di dashboard /dashboard/hackathon: arus negatif = Vin+ dan Vin− tertukar; tegangan ±0 V = GND belum bersama.</text>
</svg>
